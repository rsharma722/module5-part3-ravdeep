services:
  mongo:
    image: mongo:latest
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    environment:
      - MONGO_URI=mongodb://mongo:27017/
      - SECRET_KEY=supersecretkey
    depends_on:
      - mongo

  transactions:
    build: ./transactions
    depends_on:
      - mongo

  studentportfolio:
    build: ./studentportfolio

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - studentportfolio
      - transactions
    ports:
      - "80:80"

volumes:
  mongo_data: